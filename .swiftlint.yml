excluded:
  - .build
  - build
  - pocket-tts
  - chinesebooks
  - SpeakBook.xcodeproj
  - audioReader.xcodeproj

disabled_rules:
  - trailing_whitespace
  - line_length
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - identifier_name
  - force_cast
  - force_try
  - large_tuple
  - type_name
  - todo

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - toggle_bool
