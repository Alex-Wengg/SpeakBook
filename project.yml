name: SpeakBook
options:
  bundleIdPrefix: com.speakbook
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  INFOPLIST_FILE: Info.plist
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: VMX95L6446
targets:
  SpeakBook:
    type: application
    supportedDestinations: [iOS, macOS]
    settings:
      INFOPLIST_KEY_UIBackgroundModes: audio
    sources:
      - path: .
        excludes:
          - "*.md"
          - "*.yml"
          - "*.pdf"
          - "*.json"
          - Info.plist
          - Resources
          - build
          - "*.xcodeproj"
          - chinesebooks
          - fluidaudio_cli
          - pocket-tts
          - ios-learning-materials
          - Tests
    dependencies:
      - package: FluidAudio
        product: FluidAudio
  SpeakBookTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/SpeakBook.app/Contents/MacOS/SpeakBook"
      TEST_HOST[sdk=iphoneos*]: "$(BUILT_PRODUCTS_DIR)/SpeakBook.app/SpeakBook"
      TEST_HOST[sdk=iphonesimulator*]: "$(BUILT_PRODUCTS_DIR)/SpeakBook.app/SpeakBook"
      BUNDLE_LOADER: "$(TEST_HOST)"
    sources:
      - path: Tests
    dependencies:
      - target: SpeakBook
schemes:
  SpeakBook:
    build:
      targets:
        SpeakBook: all
        SpeakBookTests: [test]
    test:
      targets:
        - SpeakBookTests
packages:
  FluidAudio:
    path: ../FluidAudio
